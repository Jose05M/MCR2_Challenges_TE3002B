# Closed-loop, part 1: 2 m square starting at (0, 0, 0).
# Gains/thresholds from the original square_node; no final-heading alignment.

closed_loop_path_generator:
  ros__parameters:
    points_x:     [2.0, 2.0, 0.0, 0.0]
    points_y:     [0.0, 2.0, 2.0, 0.0]
    points_theta: [0.0, 0.0, 0.0, 0.0]   # unused (align_final_heading: false)
    min_reachable_dist: 0.05             # [m]

closed_loop_controller:
  ros__parameters:
    Kv: 0.7
    Kw: 0.6
    max_accel: 0.4           # [m/s²]
    v_min: 0.06              # [m/s] linear deadzone
    v_max: 0.40              # [m/s]
    w_fixed: 1.0             # [rad/s] turning speed
    align_threshold: 0.05    # [rad]
    goal_threshold: 0.05     # [m] start braking
    goal_reached_dist: 0.06  # [m]
    align_final_heading: false
