# sign_detection.yaml
# -------------------
# Parameters for the MCR2 Mini Challenge AI (traffic sign detection).
# Change values here without touching source code.
# Load via sign_detection.launch.py or:
#   ros2 run <pkg> <node> --ros-args --params-file sign_detection.yaml

traffic_light_detector:
  ros__parameters:
    # ---- Vision pipeline --------------------------------------------------
    # (kernel_size / min_circularity were ignored by the original code, which
    #  used 3 and 0.95; those effective values are kept here)
    kernel_size:       3          # morphological kernel size (px)
    min_blob_area:     200        # minimum contour area (px²) to accept as a blob
    min_circularity:   0.95       # 4πA/P² — reject non-circular detections

    # ---- HSV ranges are set as code constants (edit traffic_light_detector.py
    #      if the simulator lighting differs significantly from the defaults).

    # ---- Topics -----------------------------------------------------------
    camera_topic:      /video_source/raw
    state_topic:       /traffic_light/state
    debug_image:       true        # set false to reduce CPU load in final run

traffic_sign_detector:
  ros__parameters:
    debug_view:        true        # OpenCV window with the YOLO detections
    # Full path to the YOLO model (.pt). Change only this value to use another model.
    model_path:        /home/ed/ros2_challenge_mcr2/ros2_challenge2/src/pzb_detection/models/best_1.pt
